<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07111f" />
  <title>BVS Protocol</title>
  <meta name="description" content="BVS Protocol — Bioavailability, Vitality and Synergy." />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{--bg:#07111f;--panel:#0d1b2e;--text:#eef5ff;--muted:#a8b6c9;--line:#1e3552;--accent:#7dc4ff;--gold:#e9c46a}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 50% -10%,#17375c 0,#07111f 38%,#030913 100%);color:var(--text);line-height:1.55}
    a{color:var(--accent)} .wrap{max-width:1100px;margin:auto;padding:0 20px}.top{position:sticky;top:0;z-index:10;background:#07111fe8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .nav{display:flex;align-items:center;justify-content:space-between;min-height:66px;gap:16px}.brand{font-weight:800;letter-spacing:.08em}.lang{display:flex;gap:6px;flex-wrap:wrap}.lang button{background:#10233a;border:1px solid #274667;color:#ddecff;padding:7px 10px;border-radius:999px;cursor:pointer}.lang button.active{background:#ddecff;color:#07111f}
    .hero{padding:72px 0 44px;text-align:center}.atom{width:150px;height:150px;margin:0 auto 25px;position:relative;animation:float 4s ease-in-out infinite}.orb{position:absolute;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:30px;box-shadow:inset -14px -14px 26px #0008,0 18px 45px #0009;background:radial-gradient(circle at 32% 28%,#dff4ff,#63b6f3 34%,#193c68 72%,#07111f)}.b{left:0;top:40px}.v{right:0;top:40px}.s{left:40px;top:0;background:radial-gradient(circle at 32% 28%,#fff6cb,#e9c46a 35%,#8a6525 72%,#171107)}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
    h1{font-size:clamp(2.3rem,7vw,5rem);margin:.1em 0}.lead{max-width:760px;margin:0 auto;color:var(--muted);font-size:1.1rem}.cta{display:inline-block;margin-top:24px;padding:12px 18px;border-radius:12px;background:#ddecff;color:#07111f;text-decoration:none;font-weight:800}
    section{padding:42px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(180deg,#0f2137,#0a1728);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 50px #0004}.card h3{margin-top:0}.tag{font-size:.8rem;text-transform:uppercase;letter-spacing:.11em;color:var(--gold)}
    .supp{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.supp label{display:flex;gap:10px;align-items:flex-start;background:#0b1828;border:1px solid var(--line);padding:13px;border-radius:12px}.supp input{margin-top:5px}.water{font-size:2rem;font-weight:900}.note{color:var(--muted);font-size:.92rem}.footer{padding:36px 0 60px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
    @media(max-width:760px){.grid,.supp{grid-template-columns:1fr}.hero{padding-top:52px}.nav{align-items:flex-start;padding:12px 0;flex-direction:column}}
  </style>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand">BVS PROTOCOL</div><div class="lang" aria-label="Language selector"><button data-lang="en">EN</button><button data-lang="pt">PT</button><button data-lang="es">ES</button><button data-lang="fr">FR</button><button data-lang="it">IT</button><button data-lang="de">DE</button></div></div></header>
<main>
  <section class="hero"><div class="wrap"><div class="atom" aria-hidden="true"><div class="orb b">B</div><div class="orb v">V</div><div class="orb s">S</div></div><h1 data-i18n="heroTitle"></h1><p class="lead" data-i18n="heroText"></p><a class="cta" href="#protocol" data-i18n="start"></a></div></section>
  <section id="protocol"><div class="wrap"><div class="grid">
    <article class="card"><div class="tag">B</div><h3 data-i18n="bTitle"></h3><p data-i18n="bText"></p><p><strong data-i18n="water"></strong> <span class="water">1.5 L</span></p></article>
    <article class="card"><div class="tag">V</div><h3 data-i18n="vTitle"></h3><p data-i18n="vText"></p><p><strong data-i18n="water"></strong> <span class="water">2.0 L</span></p></article>
    <article class="card"><div class="tag">S</div><h3 data-i18n="sTitle"></h3><p data-i18n="sText"></p><p><strong data-i18n="water"></strong> <span class="water">3.0 L</span></p></article>
  </div></div></section>
  <section><div class="wrap"><h2 data-i18n="daily"></h2><div class="supp" id="checks"></div><p class="note" data-i18n="saved"></p></div></section>
  <section><div class="wrap"><div class="card"><h2 data-i18n="combos"></h2><p data-i18n="comboText"></p><p class="note" data-i18n="disclaimer"></p></div></div></section>
</main>
<footer class="footer"><div class="wrap">© <span id="year"></span> BVS Protocol · <span data-i18n="footer"></span></div></footer>
<script>
const translations={
 en:{heroTitle:'Bioavailability. Vitality. Synergy.',heroText:'A simple three-stage daily framework to organise supplements, hydration and healthy routines.',start:'View the protocol',bTitle:'Bioavailability',bText:'Vitamin D with a meal containing fat; B complex twice daily with water; vitamin C twice daily with water; magnesium at night.',vTitle:'Vitality',vText:'Everything in Bioavailability, plus CoQ10 and fish oil.',sTitle:'Synergy',sText:'Everything in Bioavailability and Vitality, plus creatine.',water:'Daily hydration:',daily:'Daily tracker',saved:'Your selections are stored locally on this device.',combos:'Timing & combinations',comboText:'Take vitamin D with a meal containing fat. Magnesium is generally best separated from large calcium doses. D3 and K2 are commonly paired. Follow product directions and professional advice.',disclaimer:'BVS Protocol is educational and is not a substitute for medical advice. Speak to a qualified healthcare professional before changing supplements, especially if you take medicines or have a medical condition.',footer:'Educational wellness framework',items:['Vitamin D','B complex — morning','B complex — later dose','Vitamin C — morning','Vitamin C — later dose','Magnesium — night','CoQ10','Fish oil','Creatine']},
 pt:{heroTitle:'Biodisponibilidade. Vitalidade. Sinergia.',heroText:'Uma estrutura diária simples em três etapas para organizar suplementos, hidratação e hábitos saudáveis.',start:'Ver o protocolo',bTitle:'Biodisponibilidade',bText:'Vitamina D com refeição contendo gordura; complexo B duas vezes ao dia com água; vitamina C duas vezes ao dia com água; magnésio à noite.',vTitle:'Vitalidade',vText:'Tudo da Biodisponibilidade, mais CoQ10 e óleo de peixe.',sTitle:'Sinergia',sText:'Tudo da Biodisponibilidade e Vitalidade, mais creatina.',water:'Hidratação diária:',daily:'Controle diário',saved:'Suas seleções ficam salvas localmente neste aparelho.',combos:'Horários e combinações',comboText:'Tome vitamina D com uma refeição contendo gordura. Em geral, é melhor separar o magnésio de doses elevadas de cálcio. D3 e K2 são frequentemente combinadas. Siga as instruções do produto e orientação profissional.',disclaimer:'O BVS Protocol é educativo e não substitui aconselhamento médico. Fale com um profissional de saúde qualificado antes de alterar suplementos, especialmente se usa medicamentos ou possui alguma condição médica.',footer:'Estrutura educativa de bem-estar',items:['Vitamina D','Complexo B — manhã','Complexo B — segunda dose','Vitamina C — manhã','Vitamina C — segunda dose','Magnésio — noite','CoQ10','Óleo de peixe','Creatina']},
 es:{heroTitle:'Biodisponibilidad. Vitalidad. Sinergia.',heroText:'Un marco diario sencillo de tres etapas para organizar suplementos, hidratación y hábitos saludables.',start:'Ver el protocolo',bTitle:'Biodisponibilidad',bText:'Vitamina D con una comida que contenga grasa; complejo B dos veces al día con agua; vitamina C dos veces al día con agua; magnesio por la noche.',vTitle:'Vitalidad',vText:'Todo lo de Biodisponibilidad, más CoQ10 y aceite de pescado.',sTitle:'Sinergia',sText:'Todo lo de Biodisponibilidad y Vitalidad, más creatina.',water:'Hidratación diaria:',daily:'Control diario',saved:'Tus selecciones se guardan localmente en este dispositivo.',combos:'Horarios y combinaciones',comboText:'Toma vitamina D con una comida que contenga grasa. En general, conviene separar el magnesio de dosis altas de calcio. D3 y K2 suelen combinarse. Sigue las instrucciones del producto y el consejo profesional.',disclaimer:'BVS Protocol es educativo y no sustituye el asesoramiento médico. Consulta a un profesional sanitario cualificado antes de cambiar suplementos, especialmente si tomas medicamentos o tienes alguna condición médica.',footer:'Marco educativo de bienestar',items:['Vitamina D','Complejo B — mañana','Complejo B — segunda dosis','Vitamina C — mañana','Vitamina C — segunda dosis','Magnesio — noche','CoQ10','Aceite de pescado','Creatina']}
};
const fallback=translations.en; const supported=['en','pt','es'];
function detect(){const saved=localStorage.getItem('bvs-lang');if(saved)return saved;const n=(navigator.language||'en').slice(0,2);return supported.includes(n)?n:'en'}
function render(lang){if(!translations[lang]) lang='en'; const t=translations[lang]; document.documentElement.lang=lang; localStorage.setItem('bvs-lang',lang); document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t[el.dataset.i18n]??fallback[el.dataset.i18n]??''}); document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang)); const checks=document.getElementById('checks');checks.innerHTML='';t.items.forEach((name,i)=>{const id='bvs-'+i;const lab=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=localStorage.getItem(id)==='1';cb.onchange=()=>localStorage.setItem(id,cb.checked?'1':'0');const span=document.createElement('span');span.textContent=name;lab.append(cb,span);checks.append(lab)});}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{if(!translations[b.dataset.lang]){alert('This language is prepared for the next translation release.');return;}render(b.dataset.lang)});document.getElementById('year').textContent=new Date().getFullYear();render(detect()); if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
