const supported=['en','pt','es','fr','it','de'];function detect(){const s=localStorage.getItem('bvs-lang');if(s&&supported.includes(s))return s;const n=(navigator.language||'en').slice(0,2);return supported.includes(n)?n:'en'}function render(lang){const t=translations[lang]||translations.en;document.documentElement.lang=lang;localStorage.setItem('bvs-lang',lang);document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]||translations.en[el.dataset.i18n]||'');document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const checks=document.getElementById('checks');checks.innerHTML='';t.items.forEach((name,i)=>{const id='bvs-'+i,lab=document.createElement('label'),cb=document.createElement('input'),span=document.createElement('span');cb.type='checkbox';cb.checked=localStorage.getItem(id)==='1';cb.onchange=()=>localStorage.setItem(id,cb.checked?'1':'0');span.textContent=name;lab.append(cb,span);checks.append(lab)})}document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>render(b.dataset.lang));document.getElementById('year').textContent=new Date().getFullYear();render(detect());if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
